# Project-wide Gradle settings.

# Give the Gradle build process more memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the Jetpack (AndroidX) support libraries instead of the old ones.
android.useAndroidX=true

# Only generate the R class for the module that declares it (faster builds).
android.nonTransitiveRClass=true

# Official Kotlin code style.
kotlin.code.style=official

# Build independent modules in parallel.
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
